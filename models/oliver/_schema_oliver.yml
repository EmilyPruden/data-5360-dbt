version: 2

models:
  - name: oliver_dim_employee
    description: "Oliver's Sweets employee information dimension"
    columns:
      - name: employee_key
        tests:
          - unique
          - not_null
  - name: oliver_dim_customer
    description: "Oliver's Sweets customer information dimension"
    columns:
      - name: customer_key
        tests:
          - unique
          - not_null
  - name: oliver_dim_date
    description: "Oliver's Date Dimension"
    columns:
      - name: date_key
        tests:
          - unique
          - not_null
  - name: oliver_dim_product
    description: "Oliver's Sweets product information dimension"
    columns:
      - name: product_key
        tests:
          - unique
          - not_null
  - name: oliver_dim_store
    description: "Oliver's Sweets store information dimension"
    columns:
      - name: store_key
        tests:
          - not_null
  - name: stg_employee_certifications
    description: "Staging model for employee certifications. Each record represents a certain certification completed by a certain employee."
    columns:
      - name: certification_name
        tests:
          - accepted_values:
              arguments:
                values: ["Leadership and Coaching", "Point of Sale Operations", "Inventory Management", "Conflict Resolution", "Strategic Retail Operations", "Workplace Safety", "Cash Handling and Security", "Customer Service Excellence", "Product Knowledge Level 2"]
  - name: fact_certification
    description: "Employee certification fact. Each record represents a certification completed by an employee."
    columns:
      - name: employee_key
        tests:
          - relationships:
              arguments:
                to: ref('oliver_dim_employee') # the model you want to compare to
                field: employee_key # the field on the model you want to compare to